<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Here you can change the title of the game -->
    <!-- Qui si cambia il titolo del gioco -->
    <title>Multi-level multi-language JavaScript Game Starter Kit</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Canvases are created in JS (see core/Canvas.js); only the current one is placed here -->
    <!-- Le canvas sono create in javascript (vedi core/Canvas.js) -->
    <div id="gameContainer">
        <!-- This is the div that will contain the game canvases -->
        <!-- Questo è il div che conterrà i canvas del gioco -->
    </div>
    
    <!-- type="module" enables import/export between the JS files. The main.js file is the entry point of the application -->
    <!-- type="module" permette l'import/export tra i file javascript. Il file main.js è il punto di ingresso dell'applicazione -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
